<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Wedding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="overlay">
      <h1>We're Getting Married</h1>
      <p>Save the Date</p>
      <h2>June 15, 2026</h2>
    </div>
  </section>

  <section class="section">
    <h2>Our Story</h2>
    <p>Two hearts, one journey. We are excited to begin this new chapter together.</p>
  </section>

  <section class="section dark">
    <h2>Wedding Details</h2>
    <div class="grid">
      <div class="card"><h3>📍 Venue</h3><p>Grand Ballroom, Massachusetts</p></div>
      <div class="card"><h3>🕒 Time</h3><p>5:00 PM</p></div>
      <div class="card"><h3>🎉 Reception</h3><p>Dinner & Dance</p></div>
    </div>
  </section>

  <section class="section">
    <h2>RSVP</h2>
    <a class="btn" href="https://forms.gle/" target="_blank">RSVP Now</a>
  </section>

  <footer>
    <p>Made with ❤️ for our wedding</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
